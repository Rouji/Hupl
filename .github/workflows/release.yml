name: create release
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: set up jdk 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: verify tag matches gradle.properties
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          TAG_VERSION=${TAG_NAME#v}
          FILE_VERSION=$(sed -n 's/^VERSION_NAME=//p' gradle.properties)
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "::error::Tag $TAG_NAME does not match VERSION_NAME in gradle.properties ($FILE_VERSION)"
            exit 1
          fi
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV

      - name: make gradlew executable
        run: chmod +x gradlew

      - name: run gradle
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PATH: "${{ github.workspace }}/keystore.jks"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo -n "$KEYSTORE_BASE64" | base64 -d > $KEYSTORE_PATH
          ./gradlew assembleRelease

      - name: rename apk
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: mv ./app/build/outputs/apk/release/app-release.apk ./app/build/outputs/apk/release/hupl_${TAG_NAME}.apk

      - name: release apk
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk

      - name: create release
        run: |
          gh release create "$TAG_NAME" app/build/outputs/apk/release/*.apk --title "$TAG_NAME" --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
